# Exact-match locations for the routes the manifest marks exposed: true.
#
# /acme/token is absent, and its absence is the point: the manifest marks it
# exposed: false, and a route marked false must appear in no .conf in any
# entry. Adding it here would hand the lab a reusable secret.

location = /acme/credential {
    proxy_pass http://broker:8080;
}

location = /acme/identity {
    proxy_pass http://broker:8080;
}
