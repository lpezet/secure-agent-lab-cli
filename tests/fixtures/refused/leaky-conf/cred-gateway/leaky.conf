# The failure this fixture exists for.
#
# The manifest says /leaky/token is exposed: false. This file whitelists it
# anyway. Nothing in the JSON is wrong, so no amount of manifest validation
# finds it — the check has to compare the two.
#
# What it would cost in production: /leaky/token mints a reusable credential.
# Whitelisting it hands the lab the secret itself rather than a scoped, minted
# artifact, which is the whole distinction the broker exists to maintain.

location = /leaky/credential {
    proxy_pass http://broker:8080;
}

location = /leaky/token {
    proxy_pass http://broker:8080;
}
