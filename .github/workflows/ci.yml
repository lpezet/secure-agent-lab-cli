name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      # Includes internal/invariants, which fails if this repo has learned
      # about a specific provider. That is the check most worth keeping green:
      # nothing else breaks at the moment it is violated.
      - run: go test ./...

      # The install script's refusals: a tampered archive, a release with no
      # checksums, a signature that does not verify. curl and cosign are fakes
      # on PATH, so this needs no network and no release to exist.
      - run: make test-install

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
