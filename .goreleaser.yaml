# GoReleaser builds every platform from one runner and publishes the checksums
# and signatures that make `curl … | bash` defensible.
#
# The install script is a look, and reviewers will say so. The mitigations are
# all here and all cheap: a checksum file, a signature over it, and an install
# script short enough that clone-and-inspect is a real alternative rather than a
# footnote.
version: 2

project_name: sal

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sal
    main: ./cmd/sal
    binary: sal
    env:
      # A static binary. The install script drops one file on PATH, and it must
      # not acquire a libc dependency on the way.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/lpezet/secure-agent-lab-cli/internal/version.version={{ .Version }}
      - -X github.com/lpezet/secure-agent-lab-cli/internal/version.commit={{ .FullCommit }}
    goos:
      # No windows target on purpose. sal drives `docker compose` and reads a
      # loopback-published port on the host; on Windows the supported path is
      # WSL, which is the linux build.
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing over the checksum file. Verifying one signature covers every
# artifact, since the checksums file covers them.
#
# A Sigstore BUNDLE rather than a detached .sig plus .pem: cosign v3 removed
# --output-signature and --output-certificate from `sign-blob`, and removed
# --signature and --certificate from `verify-blob` — so the old pair of files
# could no longer be produced OR checked. The bundle carries the signature, the
# certificate and the transparency-log entry in one file, which also means the
# install script fetches one artifact instead of two.
#
# Verification therefore needs cosign v3 or newer, and that is stated wherever
# a verify command is printed.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  # sal is tagged on its own line, separate from the stack. Its changelog
  # describes CLI changes and must never be mistaken for a boundary change.
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Every 0.x release is marked a pre-release, deliberately, rather than left to
  # `auto` — which only looks at the tag's suffix and would publish v0.2.0 as a
  # full release. The README says the design is still settling and the two
  # on-disk formats are not declared stable; the release page should not say
  # something different. This becomes `auto` at 1.0.
  prerelease: true
  footer: |
    ## Verify

    Needs [cosign](https://github.com/sigstore/cosign) v3 or newer — v2 cannot
    read this bundle format.

    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github.com/lpezet/secure-agent-lab-cli/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum -c checksums.txt --ignore-missing
    ```

    This pins the **binary**, not the lab. The stack release a project runs is
    pinned per-project and moved by `sal upgrade`.
